<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180" role="img" aria-label="Abdul Muhaimin (Abdo AT)">
  <title>Abdul Muhaimin</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#0F141D" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Name Gradient from reference: Blue -> Light Blue -> Lavender -> Pink -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="35%" stop-color="#79C0FF" />
      <stop offset="70%" stop-color="#D2A8FF" />
      <stop offset="100%" stop-color="#F778BA" />
    </linearGradient>

    <!-- Subtle Accent Line -->
    <linearGradient id="bottomLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#58A6FF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#79C0FF" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#D2A8FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F778BA" stop-opacity="0" />
    </linearGradient>

    <!-- Monogram Accent Gradient -->
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#79C0FF" />
      <stop offset="100%" stop-color="#D2A8FF" />
    </linearGradient>

    <!-- Live Ambient Scanline Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="rgba(88,166,255,0.08)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Technical Micro Grid Pattern -->
    <pattern id="headerGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#58A6FF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'SF Mono', 'Segoe UI Mono', Menlo, Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.95; }
    }
    @keyframes scanMove {
      0% { transform: translateY(-2px); }
      100% { transform: translateY(180px); }
    }

    /* Ambient Animated Elements */
    .scan {
      animation: scanMove 4.5s linear infinite;
    }
    .dot-l {
      fill: #7EE787;
      animation: pulseDot 2.4s ease-in-out infinite;
    }
    .dot-r {
      fill: #F778BA;
      animation: pulseDot 2.4s ease-in-out infinite 1.2s;
    }

    /* Staggered Load Opacity Animations */
    .anim-monogram {
      animation: fadeIn 0.5s ease both 0.1s;
    }
    .anim-eyebrow {
      animation: fadeIn 0.5s ease both 0.2s;
    }
    .anim-name {
      animation: fadeIn 0.6s ease both 0.35s;
    }
    .anim-subtitle {
      animation: fadeIn 0.6s ease both 0.5s;
    }
    .anim-badge {
      animation: fadeIn 0.5s ease both 0.25s;
    }

    /* Typography */
    .eyebrow {
      font-size: 11px;
      fill: #7EE787;
      font-weight: 600;
      letter-spacing: 1.8px;
    }
    .name-title {
      font-size: 28px;
      font-weight: 700;
      fill: url(#nameGrad);
      letter-spacing: 3.5px;
      text-transform: uppercase;
    }
    .bio-line {
      font-size: 13px;
      fill: #8B949E;
      font-weight: 400;
      letter-spacing: 0.1px;
    }
    .badge-text {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .corner-bracket {
      stroke: rgba(88, 166, 255, 0.2);
      stroke-width: 1.2;
      fill: none;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="178" rx="12" fill="url(#headerBg)" stroke="#21262D" stroke-width="1" />
  <rect x="1" y="1" width="878" height="178" rx="12" fill="url(#headerGrid)" />

  <!-- Live Subtle Ambient Scanline -->
  <rect class="scan" width="880" height="2" fill="url(#scanGrad)" />

  <!-- Subtle Precision Corner Brackets -->
  <polyline class="corner-bracket" points="10,24 10,10 24,10" />
  <polyline class="corner-bracket" points="856,10 870,10 870,24" />
  <polyline class="corner-bracket" points="10,156 10,170 24,170" />
  <polyline class="corner-bracket" points="856,170 870,170 870,156" />

  <!-- Two Subtle Pulsing Dots (Left and Right) -->
  <circle class="dot-l" cx="24" cy="90" r="2.5" />
  <circle class="dot-r" cx="856" cy="90" r="2.5" />

  <!-- Monogram Emblem (AT) — Optically Centered in 84x84 Square -->
  <g class="anim-monogram" transform="translate(46, 48)">
    <!-- Base Box -->
    <rect width="84" height="84" rx="16" fill="#121721" stroke="#21262D" stroke-width="1" />
    <rect x="5" y="5" width="74" height="74" rx="12" fill="none" stroke="url(#monoGrad)" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Optically Balanced & Centered AT Monogram -->
    <!-- Geometric 'A' (Left leg x=21, Apex x=32, Right leg x=43) -->
    <path d="M 21 58 L 32 26 L 43 58" fill="none" stroke="#F0F6FC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 'A' Crossbar (y=48, x=26 to 38) -->
    <line x1="26" y1="48" x2="38" y2="48" stroke="#F0F6FC" stroke-width="2.4" stroke-linecap="round" />
    
    <!-- Geometric 'T' (Top bar x=41 to 63 at y=26, Stem x=52 at y=26 to 58) -->
    <line x1="41" y1="26" x2="63" y2="26" stroke="#79C0FF" stroke-width="2.4" stroke-linecap="round" />
    <line x1="52" y1="26" x2="52" y2="58" stroke="#79C0FF" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- Center Content Group -->
  <g transform="translate(154, 44)">
    <!-- Eyebrow -->
    <g class="anim-eyebrow">
      <text class="mono eyebrow" x="0" y="18">// SYSTEMS · AUTOMATION · REVERSE ENGINEERING</text>
    </g>

    <!-- Name: Gradient & Monospace/Tech Font Style from Reference -->
    <g class="anim-name">
      <text class="mono name-title" x="0" y="54">Abdul Muhaimin</text>
    </g>

    <!-- Subtitle / Positioning -->
    <g class="anim-subtitle">
      <text class="sans bio-line" x="0" y="82">IT student exploring systems programming, Swift iOS tooling, and reverse engineering.</text>
    </g>
  </g>

  <!-- Right Identity Detail: ~/xabdoat Motif Perfectly Centered -->
  <g class="anim-badge" transform="translate(718, 73)">
    <rect width="116" height="34" rx="7" fill="#121721" stroke="#21262D" stroke-width="1" />
    <text class="mono badge-text" x="58" y="21" text-anchor="middle">
      <tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">/</tspan><tspan fill="#C9D1D9">xabdoat</tspan>
    </text>
  </g>

  <!-- Bottom Accent Line (Subtle Gradient) -->
  <rect x="44" y="178" width="792" height="1" fill="url(#bottomLine)" />
</svg>
