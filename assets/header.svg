<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="180" aria-label="Abdul Muhaimin (Abdo AT)" role="img" viewBox="0 0 880 180"><title>Abdul Muhaimin</title><defs><linearGradient id="headerBg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0D1117"/><stop offset="50%" stop-color="#0F141D"/><stop offset="100%" stop-color="#0D1117"/></linearGradient><linearGradient id="nameGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#58A6FF"/><stop offset="35%" stop-color="#79C0FF"/><stop offset="70%" stop-color="#D2A8FF"/><stop offset="100%" stop-color="#F778BA"/></linearGradient><linearGradient id="bottomLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/><stop offset="25%" stop-color="#58A6FF" stop-opacity=".4"/><stop offset="50%" stop-color="#79C0FF" stop-opacity=".8"/><stop offset="75%" stop-color="#D2A8FF" stop-opacity=".5"/><stop offset="100%" stop-color="#F778BA" stop-opacity="0"/></linearGradient><linearGradient id="monoGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#58A6FF"/><stop offset="50%" stop-color="#79C0FF"/><stop offset="100%" stop-color="#D2A8FF"/></linearGradient><linearGradient id="scanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="transparent"/><stop offset="50%" stop-color="rgba(88,166,255,0.08)"/><stop offset="100%" stop-color="transparent"/></linearGradient><pattern id="headerGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path fill="none" stroke="#58A6FF" stroke-opacity=".03" stroke-width="1" d="M 28 0 L 0 0 0 28"/></pattern></defs><style>@keyframes fadeIn{0%{opacity:0}}@keyframes pulseDot{0%{opacity:.2}50%{opacity:.95}}@keyframes scanMove{0%{transform:translateY(-2px)}}.mono{font-family:&apos;JetBrains Mono&apos;,&apos;SF Mono&apos;,&apos;Segoe UI Mono&apos;,Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Inter&apos;,&apos;SF Pro Display&apos;,Roboto,Helvetica,Arial,sans-serif}.scan{animation:scanMove 4.5s linear infinite}.dot-l{fill:#7ee787;animation:pulseDot 2.4s ease-in-out infinite}.dot-r{fill:#f778ba;animation:pulseDot 2.4s ease-in-out infinite 1.2s}.anim-monogram{animation:fadeIn .5s ease both .1s}.anim-eyebrow{animation:fadeIn .5s ease both .2s}.anim-name{animation:fadeIn .6s ease both .35s}.anim-subtitle{animation:fadeIn .6s ease both .5s}.anim-badge{animation:fadeIn .5s ease both .25s}.eyebrow{font-size:11px;fill:#7ee787;font-weight:600;letter-spacing:1.8px}.name-title{font-size:28px;font-weight:700;fill:url(#nameGrad);letter-spacing:3.5px;text-transform:uppercase}.bio-line{font-size:13px;fill:#8b949e;font-weight:400;letter-spacing:.1px}.badge-text{font-size:12px;font-weight:500;letter-spacing:.5px}.corner-bracket{stroke:rgba(88,166,255,.2);stroke-width:1.2;fill:none}</style><rect width="878" height="178" x="1" y="1" fill="url(#headerBg)" stroke="#21262D" stroke-width="1" rx="12"/><rect width="878" height="178" x="1" y="1" fill="url(#headerGrid)" rx="12"/><rect width="880" height="2" fill="url(#scanGrad)" class="scan"/><polyline points="10 24 10 10 24 10" class="corner-bracket"/><polyline points="856 10 870 10 870 24" class="corner-bracket"/><polyline points="10 156 10 170 24 170" class="corner-bracket"/><polyline points="856 170 870 170 870 156" class="corner-bracket"/><circle cx="24" cy="90" r="2.5" class="dot-l"/><circle cx="856" cy="90" r="2.5" class="dot-r"/><g class="anim-monogram" transform="translate(46, 48)"><rect width="84" height="84" fill="#121721" stroke="#21262D" stroke-width="1" rx="16"/><rect width="74" height="74" x="5" y="5" fill="none" stroke="url(#monoGrad)" stroke-opacity=".5" stroke-width="1.2" rx="12"/><path fill="none" stroke="#F0F6FC" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M 21 58 L 32 26 L 43 58"/><line x1="26" x2="38" y1="48" y2="48" stroke="#F0F6FC" stroke-linecap="round" stroke-width="2.4"/><line x1="41" x2="63" y1="26" y2="26" stroke="#79C0FF" stroke-linecap="round" stroke-width="2.4"/><line x1="52" x2="52" y1="26" y2="58" stroke="#79C0FF" stroke-linecap="round" stroke-width="2.4"/></g><g><g class="anim-eyebrow"><text x="0" y="18" class="mono eyebrow" transform="translate(154, 44)">// SYSTEMS · AUTOMATION · REVERSE ENGINEERING</text></g><g class="anim-name"><text x="0" y="54" class="mono name-title" transform="translate(154, 44)">Abdul Muhaimin</text></g><g class="anim-subtitle"><text x="0" y="82" class="sans bio-line" transform="translate(154, 44)">IT student exploring systems programming, Swift iOS tooling, and reverse engineering.</text></g></g><g class="anim-badge" transform="translate(718, 73)"><rect width="116" height="34" fill="#121721" stroke="#21262D" stroke-width="1" rx="7"/><text x="58" y="21" class="mono badge-text" text-anchor="middle"><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">/</tspan><tspan fill="#C9D1D9">xabdoat</tspan></text></g><rect width="792" height="1" x="44" y="178" fill="url(#bottomLine)"/></svg>