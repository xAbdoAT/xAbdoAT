<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="170" aria-label="Technical Learning &amp; Exploration Focus" role="img" viewBox="0 0 880 170"><title>Technical Learning &amp; Focus Matrix</title><defs><linearGradient id="matrixCardBg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0E121A"/><stop offset="100%" stop-color="#121722"/></linearGradient><linearGradient id="matrixCardBorder" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#283244"/><stop offset="100%" stop-color="#1A202C"/></linearGradient></defs><style>.mono{font-family:-apple-system,BlinkMacSystemFont,&apos;SF Mono&apos;,&apos;Segoe UI Mono&apos;,&apos;Roboto Mono&apos;,Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Inter&apos;,&apos;SF Pro Display&apos;,Roboto,Helvetica,Arial,sans-serif}.col-tag,.col-title{font-size:10px;fill:#8b82ff;font-weight:600;letter-spacing:1px}.col-title{font-size:14.5px;fill:#f1f5f9;letter-spacing:-.2px}.col-tech{font-size:12px;fill:#cbd5e1;font-weight:500}.col-desc{font-size:11.5px;fill:#94a3b8;font-weight:400}</style><g transform="translate(0, 0)"><rect width="278" height="168" fill="url(#matrixCardBg)" stroke="url(#matrixCardBorder)" stroke-width="1" rx="8"/><rect width="6" height="6" x="20" y="20" fill="#6366F1" rx="1.5"/><text x="34" y="26" class="mono col-tag">01 / SYSTEMS EXPLORATION</text><text x="20" y="56" class="sans col-title">Low-Level &amp; Native</text><text x="20" y="84" class="mono col-tech">C · C++ · Swift</text><text x="20" y="112" class="sans col-desc">Studying compiled execution, memory</text><text x="20" y="130" class="sans col-desc">layout, and binary fundamentals.</text></g><g transform="translate(301, 0)"><rect width="278" height="168" fill="url(#matrixCardBg)" stroke="url(#matrixCardBorder)" stroke-width="1" rx="8"/><rect width="6" height="6" x="20" y="20" fill="#10B981" rx="1.5"/><text x="34" y="26" class="mono col-tag">02 / AUTOMATION &amp; SCRIPTING</text><text x="20" y="56" class="sans col-title">Utilities &amp; Bots</text><text x="20" y="84" class="mono col-tech">Python · TypeScript · Shell</text><text x="20" y="112" class="sans col-desc">Building API clients, workflow tools,</text><text x="20" y="130" class="sans col-desc">and bot services (Telegram &amp; Discord).</text></g><g transform="translate(602, 0)"><rect width="278" height="168" fill="url(#matrixCardBg)" stroke="url(#matrixCardBorder)" stroke-width="1" rx="8"/><rect width="6" height="6" x="20" y="20" fill="#38BDF8" rx="1.5"/><text x="34" y="26" class="mono col-tag">03 / PLATFORMS &amp; TARGETS</text><text x="20" y="56" class="sans col-title">Windows · Linux · iOS</text><text x="20" y="84" class="mono col-tech">Swift · Git · Reversing</text><text x="20" y="112" class="sans col-desc">Desktop workflows, Swift iOS tooling,</text><text x="20" y="130" class="sans col-desc">and reverse engineering exploration.</text></g></svg>